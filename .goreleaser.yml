version: 2

project_name: penguinguide

release:
  # Release Please creates the GitHub release and release notes.
  # GoReleaser keeps them and uploads the generated files.
  mode: keep-existing

builds:
  - id: penguinguide

    main: .
    binary: penguinguide

    env:
      - CGO_ENABLED=0

    goos:
      - linux

    goarch:
      - amd64
      - arm64

    ldflags:
      - >-
        -s -w
        -X main.version={{ .Version }}
        -X main.commit={{ .Commit }}
        -X main.date={{ .Date }}

archives:
  - id: penguinguide-archive

    ids:
      - penguinguide

    formats:
      - tar.gz

    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

    files:
      - LICENSE
      - README.md
      - man/**

checksum:
  name_template: "checksums_{{ .ProjectName }}_{{ .Version }}.txt"

nfpms:
  - id: penguinguide-packages

    package_name: penguinguide

    ids:
      - penguinguide

    formats:
      - deb
      - rpm

    maintainer: "Scott Coffman <scott@allthingslinux.org>"
    description: "Helpful Linux guide and diagnostics tool for new users"
    license: MIT
    homepage: "https://github.com/scottc943/penguinguide"

    bindir: /usr/bin

    contents:
      - src: man/penguinguide.1
        dst: /usr/share/man/man1/penguinguide.1

      - src: LICENSE
        dst: /usr/share/licenses/penguinguide/LICENSE

    scripts:
      postinstall: packaging/postinstall.sh

aurs:
  - name: penguinguide-bin

    homepage: "https://github.com/scottc943/penguinguide"
    description: "Helpful Linux guide and diagnostics tool for new users"

    maintainers:
      - "Scott Coffman <scott@allthingslinux.org>"

    license: MIT

    git_url: "ssh://aur@aur.archlinux.org/penguinguide-bin.git"

    # Temporary key file created from the AUR_KEY_B64 secret.
    private_key: "{{ .Env.AUR_KEY_PATH }}"

    commit_author:
      name: "Scott Coffman"
      email: "scott@allthingslinux.org"

    provides:
      - penguinguide

    conflicts:
      - penguinguide

    depends:
      - glibc

    # Disable all AUR work unless publishing is explicitly enabled.
    disable: '{{ ne .Env.PUBLISH_AUR "true" }}'

    commit_msg_template: "Update to {{ .Tag }}"

    package: |-
      install -Dm755 "./penguinguide" \
        "${pkgdir}/usr/bin/penguinguide"

      install -Dm644 "./LICENSE" \
        "${pkgdir}/usr/share/licenses/penguinguide-bin/LICENSE"

      install -Dm644 "./man/penguinguide.1" \
        "${pkgdir}/usr/share/man/man1/penguinguide.1"

changelog:
  use: github
